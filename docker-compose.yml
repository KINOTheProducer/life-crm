# Self-hosted Life CRM. Copy .env.example to .env and fill it in, then: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "life_crm"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgres://life_crm:${APP_DB_PASSWORD}@postgres:5432/life_crm
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: web }
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://life_crm:${APP_DB_PASSWORD}@postgres:5432/life_crm
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DEPLOY_MODE: self-hosted
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
