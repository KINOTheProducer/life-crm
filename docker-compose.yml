# Self-hosted Life CRM. Copy .env.example to .env and fill it in, then: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "life_crm"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgres://life_crm:${APP_DB_PASSWORD}@postgres:5432/life_crm
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: web }
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://life_crm:${APP_DB_PASSWORD}@postgres:5432/life_crm
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DEPLOY_MODE: self-hosted
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      STT_BASE_URL: ${STT_BASE_URL:-http://whisper:8000/v1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: docker/web.Dockerfile, target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://life_crm:${APP_DB_PASSWORD}@postgres:5432/life_crm
      APP_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Nightly database backup to ./backups, keeping the last 14 days.
  # Restore with: gunzip -c backups/life_crm-DATE.sql.gz | docker compose exec -T postgres psql -U postgres -d life_crm
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/life_crm-$$(date +%F).sql.gz
          pg_dump -h postgres -U postgres -d life_crm --clean --if-exists | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup: wrote $$f"
          find /backups -name 'life_crm-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

  # Local speech-to-text with an OpenAI-compatible API. Remove it and set STT_BASE_URL
  # (e.g. https://api.openai.com/v1) to use a hosted service instead.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub

volumes:
  pgdata:
  whisper-models:
