name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # All-in-one image (migrations + worker + web) for Unraid and quick installs.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          target: allinone
          push: true
          tags: |
            ghcr.io/kinotheproducer/life-crm:latest
            ghcr.io/kinotheproducer/life-crm:${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes \
            --notes "Image: ghcr.io/kinotheproducer/life-crm:${{ steps.v.outputs.tag }}"
